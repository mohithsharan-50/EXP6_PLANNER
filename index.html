<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 Home Decor Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header>
    <div class="brand">
      <span class="brand-icon">🛋️</span>
      <div>
        <h1>Home Decor Planner</h1>
        <p class="tagline">Curate your perfect space, one idea at a time</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-pill">
        <span class="stat-label">Pending</span>
        <span id="openCount" class="stat-value">0</span>
      </div>
      <div class="stat-pill done-pill">
        <span class="stat-label">Done</span>
        <span id="doneCount" class="stat-value">0</span>
      </div>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main>

    <!-- ADD ITEM FORM -->
    <section class="add-section">
      <form id="addForm">
        <div class="input-row">
          <select id="categorySelect">
            <option value="Living Room">🛋️ Living Room</option>
            <option value="Bedroom">🛏️ Bedroom</option>
            <option value="Kitchen">🍳 Kitchen</option>
            <option value="Bathroom">🚿 Bathroom</option>
            <option value="Garden">🌿 Garden</option>
            <option value="Lighting">💡 Lighting</option>
            <option value="Art & Walls">🖼️ Art & Walls</option>
          </select>
          <input
            type="text"
            id="taskInput"
            placeholder="e.g. Velvet throw pillows in terracotta..."
            autocomplete="off"
            required
          />
          <button type="submit" id="addBtn">+ Add</button>
        </div>
      </form>
    </section>

    <!-- FILTER TABS -->
    <section class="filter-section">
      <div class="filter-tabs">
        <button class="tab active" data-filter="all">All Items</button>
        <button class="tab" data-filter="pending">Pending</button>
        <button class="tab" data-filter="done">Completed</button>
      </div>
      <button id="clearDoneBtn" title="Remove all completed items">🗑️ Clear Done</button>
    </section>

    <!-- TASK LIST -->
    <section class="list-section">
      <ul id="taskList">
        <!-- Tasks injected by JS -->
      </ul>
      <div id="emptyState" class="empty-state hidden">
        <span>🏡</span>
        <p>No decor ideas here yet.<br/>Start planning your dream space!</p>
      </div>
    </section>

  </main>

  <footer>
    <p>✨ Data saved locally — your ideas are always here when you return</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
